# Objects placed in the Gazebo world by spawn_objects.
#
# Each object is listed under "objects" and has its own section, named after it.
# The name is the Gazebo model name; other nodes find the object by it.
#
#   position  [x, y, z] of the object's centre, in the world (= map) frame, metres.
#             A box of height h standing on a table of height t: z = t + h/2.
#   yaw       turn about the vertical axis, radians (optional, default 0)
#   size      [x, y, z] in metres - a box is generated (with mass, friction and
#             contact settings that keep it steady between gripper fingers)
#   mass      kg, for a generated box (optional, default 0.2)
#   color     [red, green, blue], 0 to 1, for a generated box (optional)
#   model     instead of size: an SDF file - a full path, or a file in this
#             package's models/ folder
#
# If an object already exists, it is moved back to its position (reset: true).
#
# gripper_links: links of the robot (gripper_model) that must not collide with the
# objects - the gripper's fingers. The simulated fingers do not stop at an object; one
# that is not exactly centred between them is hit at full speed and thrown off the
# table. The objects are held by neo_link_attacher's attach instead. Gazebo names
# (fixed-joint chains are lumped: the pads are part of the inner fingers). An empty
# list leaves the collisions as they are.

spawn_objects:
  ros__parameters:
    reset: true
    objects: [cube]
    gripper_model: mpo_700
    gripper_links: [left_inner_finger, right_inner_finger, left_inner_knuckle,
                    right_inner_knuckle, left_outer_knuckle, right_outer_knuckle]

    cube:
      # 80 mm: leaves about 19 mm between each finger pad and the cube with the
      # gripper open (open pose 0.07), enough for the robot's stopping error.
      # Closed on the cube: finger_joint 0.265.
      size: [0.08, 0.08, 0.08]
      # On the first cafe table (centre -1.492, -4.548; top at 0.775 m), centred
      # between the finger pads of the grasp pose (Stage_values.md) with the robot
      # at the pick position (-1.51, -3.58, yaw -90 deg). 0.775 + 0.08 / 2 = 0.815.
      position: [-1.496, -4.190, 0.815]
