# Cartesian limits for the Pilz industrial motion planner.
#
# Required by the pilz_industrial_motion_planner pipeline: LIN and CIRC are planned
# in Cartesian space, so the planner needs translational/rotational limits that the
# per-joint limits in joint_limits.yaml cannot express. Without this file the
# pipeline fails to initialise and every LIN request errors out.
#
# Values are deliberately slow. The linear moves that use this pipeline are the ones
# made close to the object and the table (approach, lift, lower, retreat), where a
# fast move either knocks the 50 g cube over or, on contact with the table, drives
# the position-controlled arm into a path-tolerance abort.
cartesian_limits:
  max_trans_vel: 0.25       # m/s
  max_trans_acc: 0.5        # m/s^2
  max_trans_dec: -0.5       # m/s^2, must be negative
  max_rot_vel: 0.5          # rad/s
